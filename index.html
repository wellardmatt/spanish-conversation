<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Conversación en Español</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e6edf3;
      --text-muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-dim: rgba(59, 130, 246, 0.15);
      --correct: #22c55e;
      --correct-bg: rgba(34, 197, 94, 0.12);
      --mic-active: #ef4444;
      --you-bubble: #1e3a5f;
      --bot-bubble: #252d3d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0;
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .api-btn {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 10px 16px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .api-btn:active {
      opacity: 0.9;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .msg.you {
      align-self: flex-end;
      background: var(--you-bubble);
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .speak-again {
      margin-left: 8px;
      padding: 4px 8px;
      font-size: 0.9rem;
      border: none;
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      touch-action: manipulation;
      vertical-align: middle;
    }

    .msg .correction {
      margin-top: 8px;
      padding: 8px 10px;
      background: var(--correct-bg);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--correct);
      border-left: 3px solid var(--correct);
    }

    .msg .correction strong {
      font-weight: 600;
    }

    .input-area {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-wrap {
      flex: 1;
      min-width: 0;
    }

    #userInput {
      width: 100%;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }

    #userInput::placeholder {
      color: var(--text-muted);
    }

    #userInput:focus {
      outline: none;
      border-color: var(--accent);
    }

    .mic-btn {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: relative;
      z-index: 10;
      user-select: none;
      -webkit-user-select: none;
    }

    .mic-btn:active {
      transform: scale(0.96);
    }

    .mic-btn.listening {
      background: var(--mic-active);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    .mic-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-btn {
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      padding: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      -webkit-overflow-scrolling: touch;
      overflow: auto;
    }

    .modal {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      border: 1px solid var(--border);
      position: relative;
      z-index: 101;
    }

    .modal h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
    }

    .modal p {
      margin: 0 0 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .modal input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      margin-bottom: 16px;
      min-height: 48px;
      touch-action: manipulation;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 12px 20px;
      min-height: 48px;
      min-width: 100px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-actions .cancel {
      background: var(--border);
      color: var(--text);
    }

    .modal-actions .save {
      background: var(--accent);
      color: white;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Conversación en Español</h1>
      <button type="button" class="api-btn" id="apiKeyBtn" onclick="window.openApiModal && window.openApiModal()">API key</button>
    </header>

    <div class="messages" id="messages"></div>

    <div class="status" id="status"></div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="userInput" rows="1" placeholder="Escribe o usa el micrófono..." autocomplete="off"></textarea>
      </div>
      <button type="button" class="mic-btn" id="micBtn" title="Hablar" aria-label="Hablar" onclick="window.toggleMic && window.toggleMic()">🎤</button>
      <button type="button" class="send-btn" id="sendBtn" title="Enviar" aria-label="Enviar">➤</button>
    </div>
  </div>

  <div class="modal-overlay hidden" id="apiModal">
    <div class="modal">
      <h2>OpenAI API key</h2>
      <p>La app usa OpenAI para mantener la conversación y corregir tu español. Introduce tu clave (se guarda solo en tu dispositivo).</p>
      <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off" />
      <div class="modal-actions">
        <button type="button" class="cancel" id="apiCancel" onclick="window.closeApiModal && window.closeApiModal()">Cancelar</button>
        <button type="button" class="save" id="apiSave" onclick="window.saveApiKey && window.saveApiKey()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
